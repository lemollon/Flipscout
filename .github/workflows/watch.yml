# Always-on deal watcher — free hourly scheduler.
#
# Runs your watchlist, alerts on NEW deals only, pushes them to your Discord/Slack
# webhook (or email). Nothing to host — GitHub runs it for you.
#
# Setup (once): repo Settings → Secrets and variables → Actions → add:
#   EBAY_CLIENT_ID, EBAY_CLIENT_SECRET   (your eBay app keys)
#   FLIPSCOUT_WATCHLIST                  (your searches, comma- or newline-separated)
#   FLIPSCOUT_ALERT_WEBHOOK              (a Discord or Slack incoming-webhook URL)
# Optional Variables (Settings → Variables): FLIPSCOUT_SOURCES, FLIPSCOUT_MIN_PROFIT,
#   FLIPSCOUT_MIN_ROI, FLIPSCOUT_TOP, FLIPSCOUT_LOCAL, FLIPSCOUT_ZIP.

name: Flipscout deal watch

on:
  # RE-ARMED 2026-07-25, pointed at flipscout.hunt (multi-source) instead of the
  # old eBay-API watcher. What changed since it was disabled:
  #   * no eBay keys needed - it hunts ShopGoodwill + HiBid, both headless-friendly
  #   * it only prices MEASURED models from the price book (TI-84 Plus CE), so it
  #     can't alert on the ones that mathematically cannot profit
  #   * every alert carries an opening bid AND a never-exceed max bid
  # If the runner's datacenter IP gets blocked, hunt.run() reports blocked=True
  # rather than silently reporting "no deals" - watch the log line.
  schedule:
    # TWO entries on purpose: GitHub's scheduler is best-effort and sheds load
    # at busy hours — on 2026-07-28 it silently skipped the 15:17Z and 16:17Z
    # firings, a 2h9m alert gap that read as "Flipscout stopped updating".
    # Each entry is dispatched independently, so a skipped slot now costs ~30
    # minutes instead of 2+ hours. Runs are cheap: the seen-cache means a
    # second sweep with nothing new only refreshes the board.
    - cron: "17 * * * *"        # hourly at :17 (off the top-of-hour rush)
    - cron: "47 * * * *"        # and at :47, as insurance against skips

  # --- history: why it was off (BOTH REASONS RESOLVED - see below) ----------
  # RESOLVED 1: the eBay developer account was APPROVED on 2026-07-29 (appeal
  #   granted); keys are in this repo's Actions secrets and `ebay: auth OK`
  #   appears in every run. Reason 1 below is history, not current state.
  # RESOLVED 2: the $80-comp floor is now enforced by the price book itself -
  #   nothing gets a Model entry unless it clears it (2026-08-15: stock Game
  #   Boy Color measured $48.44 and went to DEAD_MODELS instead of the book).
  # Everything under this line is kept as the record of WHY, not as status.
  #
  # SCHEDULE DISABLED 2026-07-24. Two reasons, in order:
  #
  #  1. It was failing every run (~12 red runs/day) — the eBay developer account was
  #     rejected, so EBAY_CLIENT_ID/SECRET were never set and watch.py raised at
  #     import of EbayConfig.from_env().
  #  2. More importantly, we measured the economics before re-arming it. eBay resale
  #     carries $5.40-$14 of FIXED cost per flip (13.25% FVF + $0.40 + postage), so
  #     anything reselling under ~$25 can't profit no matter how cheap the buy.
  #     Live test: 496 Goodwill listings -> 0 deals cleared $20 profit + 60% ROI,
  #     median -$14.71. Junk lots were worse (buy ~$20, they resell for ~$6).
  #     Re-arming this would just deliver confident alerts on money-losing trades.
  #
  # To re-enable: uncomment the schedule AND raise the resale floor (an $80+ comp,
  # not a category filter) — see `flipscout comp` for checking a real sold price.
  # schedule:
  #   - cron: "17 * * * *"        # hourly at :17 (off the top-of-hour rush)
  workflow_dispatch: {}          # manual runs from the Actions tab still work

concurrency:                     # don't overlap runs
  group: flipscout-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # Needed by the "Publish the deals board" step below - the default token is
    # read-only, so without this the board commit fails at the push.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      # Persist the seen-cache across runs so you're not re-alerted on the same item.
      - uses: actions/cache@v4
        with:
          path: |
            flipscout_seen.json
            flipscout_heartbeat.json
          key: flipscout-seen-${{ github.run_id }}
          restore-keys: flipscout-seen-
      - name: Hunt every source and alert
        run: python -m flipscout.hunt
        env:
          FLIPSCOUT_ALERT_WEBHOOK: ${{ secrets.FLIPSCOUT_ALERT_WEBHOOK }}
          # Card alerts route to their own channel. BOTH are needed and they are
          # not the same thing: the webhook POSTS the card, the channel id is
          # what lets the bot put the tap-to-arm chips on it.
          #
          # 🚨 A SECRET THAT IS NOT MAPPED HERE IS INERT, and this file already
          # carries that scar three lines down ("three of them were set and
          # silently inert for a full run, and the log looked perfectly
          # healthy"). notify.destination() falls back to the main channel when
          # the cards webhook is missing - by design, so a routing rule can
          # never make an alert vanish - which means an unmapped secret shows up
          # as "cards go to #flips", not as an error.
          FLIPSCOUT_CARDS_WEBHOOK: ${{ secrets.FLIPSCOUT_CARDS_WEBHOOK }}
          # SUBJECT CHANNELS, added 2026-08-23. Each is OPTIONAL and each is
          # a PAIR: the *_WEBHOOK secret posts the card, the *_CHANNEL_ID
          # variable is what lets the bot put the tap-to-arm chips on it.
          # Unset ones fall back (camcorders -> cameras -> the main channel),
          # so create only the channels you actually want - but map them ALL
          # here, because a secret this block does not name is inert and
          # silent. `[hunt] <name> destination:` prints the truth every run.
          FLIPSCOUT_WATCHES_WEBHOOK: ${{ secrets.FLIPSCOUT_WATCHES_WEBHOOK }}
          FLIPSCOUT_CAMERAS_WEBHOOK: ${{ secrets.FLIPSCOUT_CAMERAS_WEBHOOK }}
          FLIPSCOUT_CAMCORDERS_WEBHOOK: ${{ secrets.FLIPSCOUT_CAMCORDERS_WEBHOOK }}
          FLIPSCOUT_IPODS_WEBHOOK: ${{ secrets.FLIPSCOUT_IPODS_WEBHOOK }}
          FLIPSCOUT_GAMES_WEBHOOK: ${{ secrets.FLIPSCOUT_GAMES_WEBHOOK }}
          # PriceCharting collections-for-sale. ON by default and needs no key
          # (the feed is public), so this maps ONLY the off switch - mapped NOW
          # per this file's own env-trap rule, because a variable that is not
          # in this block does nothing at all and does it silently.
          FLIPSCOUT_COLLECTIONS: ${{ vars.FLIPSCOUT_COLLECTIONS }}
          # Pokemon card comps (TCGplayer market via api.pokemontcg.io). The
          # API works with NO key; a free key raises the daily allowance,
          # which matters because GitHub runners share IPs with everyone
          # else's quota. Mapped NOW per this file's own env-trap rule, so
          # adding one later is `gh secret set` and nothing else.
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
          # Sports-card comps, keyed by player+set+parallel+GRADE
          # (SportsCardsPro). The scout's sports lookup is INERT without
          # this - no token, no calls, eBay fallback exactly as before - so
          # adding the secret is the whole switch. API is their $49/mo
          # Legendary tier; the $6 tier does not include it.
          SPORTSCARDSPRO_TOKEN: ${{ secrets.SPORTSCARDSPRO_TOKEN }}
          FLIPSCOUT_CARDS_CHANNEL_ID: ${{ vars.FLIPSCOUT_CARDS_CHANNEL_ID }}
          FLIPSCOUT_WATCHES_CHANNEL_ID: ${{ vars.FLIPSCOUT_WATCHES_CHANNEL_ID }}
          FLIPSCOUT_CAMERAS_CHANNEL_ID: ${{ vars.FLIPSCOUT_CAMERAS_CHANNEL_ID }}
          FLIPSCOUT_CAMCORDERS_CHANNEL_ID: ${{ vars.FLIPSCOUT_CAMCORDERS_CHANNEL_ID }}
          FLIPSCOUT_IPODS_CHANNEL_ID: ${{ vars.FLIPSCOUT_IPODS_CHANNEL_ID }}
          FLIPSCOUT_GAMES_CHANNEL_ID: ${{ vars.FLIPSCOUT_GAMES_CHANNEL_ID }}
          FLIPSCOUT_DISCORD_CHANNEL_ID: ${{ vars.FLIPSCOUT_DISCORD_CHANNEL_ID }}
          # How many runs it takes to sweep the whole eBay term pool once.
          # 8 = full coverage every ~4 hours for ~1/8 the calls; the daily
          # allowance was otherwise gone by 05:00 UTC. Raise if the 429s come
          # back, lower (1 = every-run) if eBay grants more quota.
          FLIPSCOUT_EBAY_ROTATION: ${{ vars.FLIPSCOUT_EBAY_ROTATION || '8' }}
          FLIPSCOUT_SOURCES: ${{ vars.FLIPSCOUT_SOURCES || 'goodwill,hibid' }}
          FLIPSCOUT_TARGET_PROFIT: ${{ vars.FLIPSCOUT_TARGET_PROFIT || '20' }}
          FLIPSCOUT_INBOUND_SHIP: ${{ vars.FLIPSCOUT_INBOUND_SHIP || '9' }}
          FLIPSCOUT_MAX_ASK_RATIO: ${{ vars.FLIPSCOUT_MAX_ASK_RATIO || '' }}
          FLIPSCOUT_ENDING_SOON_HOURS: ${{ vars.FLIPSCOUT_ENDING_SOON_HOURS || '2' }}
          # eBay Browse hunter: sleeps until these secrets exist (the env-trap
          # rule - mapped NOW so approval day is `gh secret set` x2, nothing else)
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          FLIPSCOUT_TOP: ${{ vars.FLIPSCOUT_TOP || '10' }}
          FLIPSCOUT_STATE_FILE: flipscout_seen.json
          # Anything NOT listed here is invisible to the run, however carefully
          # you set it with `gh variable set`. FLIPSCOUT_ZIP, RADIUS_MILES and
          # ESTATE_AREA were all set on the repo and silently did nothing - the
          # run looked healthy while HiBid searched nationally only and the
          # estate digest never fired. FLIPSCOUT_CL_CITIES had the same hole and
          # only worked because the code default is already houston.
          FLIPSCOUT_CL_CITIES: ${{ vars.FLIPSCOUT_CL_CITIES || 'houston' }}
          FLIPSCOUT_ZIP: ${{ vars.FLIPSCOUT_ZIP }}
          FLIPSCOUT_RADIUS_MILES: ${{ vars.FLIPSCOUT_RADIUS_MILES }}
          FLIPSCOUT_NELLIS_LOCATION: ${{ vars.FLIPSCOUT_NELLIS_LOCATION || 'houston' }}
          FLIPSCOUT_ESTATE_AREA: ${{ vars.FLIPSCOUT_ESTATE_AREA }}
          FLIPSCOUT_GSALR_CITIES: ${{ vars.FLIPSCOUT_GSALR_CITIES || 'fulshear-tx,katy-tx' }}
          FLIPSCOUT_BOARD_FILE: docs/deals.json
          FLIPSCOUT_HEARTBEAT_FILE: flipscout_heartbeat.json

      # Publish the qualifying items so the web app's deals board shows real
      # items instead of an empty scanner. Committing it (rather than caching)
      # is what makes the board work with no server and no API keys.
      - name: Publish the deals board
        run: |
          git config user.name  "flipscout-bot"
          git config user.email "flipscout-bot@users.noreply.github.com"
          git add docs/deals.json docs/BOARD.md
          git diff --cached --quiet || git commit -m "board: refresh deals [skip ci]"
          # Rebase before pushing. The runner checked main out ~6 minutes ago,
          # so ANY merge during the hunt makes this push a non-fast-forward and
          # the whole run fails with a fresh board it never published. Observed
          # 2026-08-18: run 32167190745 died exactly this way.
          #
          # Rebase is safe here because the only thing this job commits is the
          # board, and the board is regenerated from scratch every run - there
          # is no history to preserve and nothing to conflict over.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push race on attempt $attempt - retrying"
            sleep 5
          done
          echo "::error::could not publish the board after 3 attempts"
          exit 1
